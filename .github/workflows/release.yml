name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write a placeholder .env
        run: |
          cat > .env <<'EOF'
          YTMUSIC_SERVICE_URL=http://127.0.0.1:8787
          YTMUSIC_SHARED_SECRET=ci-placeholder
          EOF

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Build the container, and discard it
        run: docker build -t timbre:ci-check .

  release:
    name: Version, changelog and GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Work out the version
        id: version
        env:
          RELEASE_DATE: ${{ github.event.head_commit.timestamp }}
        run: node scripts/release.mts

      - name: Commit, tag and push
        if: steps.version.outputs.released == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "bishop076"
          git config user.email "271764729+bishop076@users.noreply.github.com"
          git add package.json apps/web/package.json CHANGELOG.md
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag -a "$TAG" -m "Timbre $VERSION"
          git push --atomic "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main "refs/tags/$TAG"

      - name: Publish the Release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists."
              exit 0
            fi
            if gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          echo "::error::Could not publish $TAG after 5 attempts. The tag is pushed;"
          echo "::error::create the Release by hand with: gh release create $TAG"
          exit 1

      - name: Say why nothing was released
        if: steps.version.outputs.released != 'true'
        run: echo "No feat, fix or perf since the last tag — nothing to release." >> "$GITHUB_STEP_SUMMARY"
