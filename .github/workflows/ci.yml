name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write a placeholder .env
        run: |
          cat > .env <<'EOF'
          YTMUSIC_SERVICE_URL=http://127.0.0.1:8787
          YTMUSIC_SHARED_SECRET=ci-placeholder
          EOF

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # The sidecar has had pip-audit since the first pass; this is the other runtime's
      # half of it. Runtime dependencies only, and only high and above, so a dev-only
      # advisory does not stop an unrelated pull request.
      - name: Audit the locked dependencies
        run: pnpm audit --prod --audit-level high

  ytmusic:
    name: Sidecar (lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ytmusic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the sidecar container, and discard it
        run: docker build -t timbre-sidecar:ci-check .

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/ytmusic/uv.lock

      - run: uv sync --locked --extra dev --python 3.11

      - run: uv run ruff check .
      - run: uv run pytest -q

      - name: Audit the locked dependencies
        run: |
          uv export --frozen --extra dev --no-emit-project \
            --format requirements-txt -o "$RUNNER_TEMP/audit.txt"
          uv run pip-audit --requirement "$RUNNER_TEMP/audit.txt" --progress-spinner off
