name: Spotify canary

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      drill:
        description: "Blank the search hash on purpose, to prove the alarm works"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spotify-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Live Spotify checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Spotify
        run: node scripts/spotify-canary.mts --report "$RUNNER_TEMP/spotify-canary.md" ${{ inputs.drill && '--drill' || '' }}

      - name: Keep the report for the issue
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spotify-canary-report
          path: ${{ runner.temp }}/spotify-canary.md
          if-no-files-found: ignore
          retention-days: 1

  issue:
    name: Open, update or close the breakage issue
    needs: canary
    if: always() && (needs.canary.result == 'failure' || needs.canary.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Fetch the report
        if: needs.canary.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spotify-canary-report
          path: ${{ runner.temp }}

      - name: Open or update the breakage issue
        if: needs.canary.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/spotify-canary.md"
          [ -f "$report" ] || echo "The canary failed before it could write a report." > "$report"
          printf '\n[Run log](%s)\n' "$RUN_URL" >> "$report"

          gh label create spotify-breakage --color B60205 \
            --description "The no-account Spotify path needs attention" 2>/dev/null || true

          open=$(gh issue list --label spotify-breakage --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$report"
          else
            gh issue create --label spotify-breakage \
              --title "Spotify canary: the no-account Spotify path needs attention" \
              --body-file "$report"
          fi

      - name: Close the breakage issue once it passes again
        if: needs.canary.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for number in $(gh issue list --label spotify-breakage --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Passing again: $RUN_URL"
          done
