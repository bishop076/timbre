[project]
name = "timbre-ytmusic"
version = "0.0.0"
description = "Internal sidecar exposing YouTube Music via ytmusicapi as JSON."
requires-python = ">=3.11"
dependencies = [
    # Pinned to a minor range on purpose: ytmusicapi is unofficial and tracks
    # YouTube's private web API, so a surprise upgrade can break ingest.
    "ytmusicapi>=1.12,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# pip-audit is here rather than installed ad hoc in CI so the scanner is locked like
# everything else, and so the same check runs locally.
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "pip-audit>=2.7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` is imported from the source tree rather than from an install. There is no
# `[build-system]` here on purpose: this is an application, not a library — the container
# runs `uvicorn app.main:app` out of its working directory and Vercel loads `app/main.py`
# by path, so neither ever needed it installed. uv reads that absence as a virtual project
# and syncs only the dependencies, which is correct and is also why the tests need this
# line: `pip install -e .` used to leave a `.pth` behind that quietly did the same job.
pythonpath = ["."]
